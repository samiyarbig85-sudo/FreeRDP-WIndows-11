name: macOS-Remote

on:
  workflow_dispatch:

jobs:
  secure-remote:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Enable Remote Management (VNC)
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -configure -restart -agent -privs -all

          # Enable Screen Sharing
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist

      - name: Create Remote User with Secure Password
        run: |
          PASSWORD=$(LC_ALL=C tr -dc 'A-Za-z0-9!@#$%^&*()_+' </dev/urandom | head -c 20)

          sudo sysadminctl -addUser RDP \
            -password "$PASSWORD" \
            -admin

          echo "REMOTE_USER=RDP" >> $GITHUB_ENV
          echo "REMOTE_PASS=$PASSWORD" >> $GITHUB_ENV

      - name: Install Tailscale
        run: |
          brew install tailscale
          sudo tailscaled install-system-daemon

      - name: Connect to Tailscale
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-macos-${{ github.run_id }}

          for i in {1..10}; do
            TS_IP=$(tailscale ip -4 | head -n 1)
            [ -n "$TS_IP" ] && break
            sleep 5
          done

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP not assigned"
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Verify VNC Port
        run: |
          nc -zv $TAILSCALE_IP 5900 || exit 1
          echo "VNC port is accessible"

      - name: Maintain Connection
        run: |
          echo ""
          echo "====== macOS REMOTE ACCESS ======"
          echo "Address : $TAILSCALE_IP:5900"
          echo "Username: $REMOTE_USER"
          echo "Password: $REMOTE_PASS"
          echo "Protocol: VNC / Screen Sharing"
          echo "================================="
          echo ""

          while true; do
            echo "[$(date)] macOS Remote Active"
            sleep 300
          done
