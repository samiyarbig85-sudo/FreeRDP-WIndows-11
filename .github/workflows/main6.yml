name: macOS-Remote-Desktop

on:
  workflow_dispatch:

jobs:
  macos-vnc:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Enable Remote Management (VNC)
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvncpw -vncpw "SecretVNC123" \
            -restart -agent -privs -all

      - name: Create New Admin User
        run: |
          # رفتن به دایرکتوری روت برای جلوگیری از خطای Permission Denied در دایرکتوری فعلی
          cd /
          
          # ایجاد کاربر جدید
          sudo dscl . -create /Users/rdpuser
          sudo dscl . -create /Users/rdpuser UserShell /bin/bash
          sudo dscl . -create /Users/rdpuser RealName "Remote Admin"
          sudo dscl . -create /Users/rdpuser UniqueID 701
          sudo dscl . -create /Users/rdpuser PrimaryGroupID 80
          sudo dscl . -create /Users/rdpuser NFSHomeDirectory /Users/rdpuser
          sudo dscl . -passwd /Users/rdpuser "MacAccess@2026"
          
          # اضافه کردن به گروه ادمین و فعال سازی دسترسی‌ها
          sudo dscl . -append /Groups/admin GroupMembership rdpuser
          sudo dscl . -append /Groups/_appserverusr GroupMembership rdpuser
          
          # ساخت دایرکتوری هوم و تنظیم مالکیت
          sudo mkdir -p /Users/rdpuser
          sudo chown rdpuser:staff /Users/rdpuser
          
          echo "User creation successful."

      - name: Install & Start Tailscale
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          # تغییر دایرکتوری به /tmp برای جلوگیری از خطای shell-init
          cd /tmp
          
          brew install tailscale
          sudo tailscaled > /dev/null 2>&1 &
          sleep 15
          
          if [ -z "$TS_KEY" ]; then
            echo "❌ ERROR: TAILSCALE_AUTH_KEY is missing in Secrets!"
            exit 1
          fi

          sudo tailscale up --authkey=$TS_KEY --hostname=gh-mac-runner --accept-routes
          
          echo "TS_IP=$(tailscale ip -4)" >> $GITHUB_ENV

      - name: Final Connection Info
        run: |
          echo "=========================================="
          echo "✅ macOS IS READY!"
          echo "📍 Tailscale IP: ${{ env.TS_IP }}"
          echo "👤 Username: rdpuser"
          echo "🔑 Password: MacAccess@2026"
          echo "🔒 VNC Password: SecretVNC123"
          echo "=========================================="
          
          # حلقه Keep-alive در دایرکتوری امن
          cd /tmp
          while true; do
            echo "Keep-alive: $(date)"
            sleep 300
          done
          
