name: macOS-Remote-Desktop-Full-GUI

on:
  workflow_dispatch:

jobs:
  macos-vnc:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Enable Remote Management & GUI Fix
        run: |
          # فعال‌سازی سرویس اشتراک‌گذاری صفحه
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvncpw -vncpw "SecretVNC123" \
            -restart -agent -privs -all
          
          # بیدار نگه داشتن سیستم برای جلوگیری از سیاه شدن صفحه
          sudo caffeinate -u -t 3600 &

      - name: Create Isolated Admin User
        run: |
          cd /
          USER_NAME="rdpuser"
          USER_PASS="MacAccess@2026"
          
          # ساخت یوزر جدید برای دور زدن محدودیت‌های پسورد رانر
          sudo dscl . -create /Users/$USER_NAME
          sudo dscl . -create /Users/$USER_NAME UserShell /bin/bash
          sudo dscl . -create /Users/$USER_NAME RealName "Remote Admin"
          sudo dscl . -create /Users/$USER_NAME UniqueID 701
          sudo dscl . -create /Users/$USER_NAME PrimaryGroupID 80
          sudo dscl . -create /Users/$USER_NAME NFSHomeDirectory /Users/$USER_NAME
          sudo dscl . -passwd /Users/$USER_NAME "$USER_PASS"
          sudo dscl . -append /Groups/admin GroupMembership $USER_NAME
          
          sudo mkdir -p /Users/$USER_NAME
          sudo chown $USER_NAME:staff /Users/$USER_NAME
          
          echo "USER_NAME=$USER_NAME" >> $GITHUB_ENV
          echo "USER_PASS=$USER_PASS" >> $GITHUB_ENV

      - name: Install Tailscale & Display Tools
        run: |
          cd /tmp
          # نصب Tailscale و ابزار تنظیم رزولوشن
          brew install tailscale displayplacer
          
          # تلاش برای تنظیم رزولوشن (برای رفع مشکل صفحه سیاه)
          displayplacer "res:1280x720 color_depth:8 scaling:on" || echo "Display resize failed, but continuing..."

      - name: Start Tailscale
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          cd /tmp
          sudo tailscaled > /dev/null 2>&1 &
          sleep 15
          
          if [[ -z "$TS_KEY" ]]; then
            echo "❌ ERROR: TAILSCALE_AUTH_KEY is missing!"
            exit 1
          fi

          sudo tailscale up --authkey=$TS_KEY --hostname=gh-mac-gui --accept-routes
          echo "TS_IP=$(tailscale ip -4)" >> $GITHUB_ENV

      - name: Final Credentials & Keep Alive
        run: |
          echo "=========================================="
          echo "✅ macOS GUI IS READY!"
          echo "------------------------------------------"
          echo "📍 Tailscale IP: ${{ env.TS_IP }}"
          echo "👤 Username: ${{ env.USER_NAME }}"
          echo "🔑 Password: ${{ env.USER_PASS }}"
          echo "🔒 VNC Password: SecretVNC123"
          echo "=========================================="
          echo "نکته: اگر هنوز صفحه سیاه است، یکبار کلید Enter را بزنید و پسورد سیستم را تایپ کنید."
          
          cd /tmp
          while true; do
            echo "Runner Active: $(date) | IP: ${{ env.TS_IP }}"
            sleep 300
          done
          
