name: macOS-Remote-Desktop

on:
  workflow_dispatch:

jobs:
  macos-vnc:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Enable Remote Management (VNC)
        run: |
          # فعال‌سازی Screen Sharing با رمز VNC
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvncpw -vncpw "SecretVNC123" \
            -restart -agent -privs -all

      - name: Force Password Change (No Old Pass Required)
        run: |
          # استفاده از پسورد رندوم برای امنیت و دور زدن نیاز به پسورد قدیمی
          USER_NAME=$(whoami)
          NEW_PASS="MacAccess@2026"
          
          # متد نهایی برای تغییر پسورد در Runner بدون نیاز به پسورد قبلی
          sudo dscl . -passwd /Users/$USER_NAME "$NEW_PASS" || \
          sudo passwd $USER_NAME <<EOF
          $NEW_PASS
          $NEW_PASS
          EOF
          
          echo "USER_NAME=$USER_NAME" >> $GITHUB_ENV
          echo "USER_PASS=$NEW_PASS" >> $GITHUB_ENV

      - name: Install Tailscale
        run: |
          brew install tailscale

      - name: Start Tailscale
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          # اجرای سرویس
          sudo tailscaled > /dev/null 2>&1 &
          sleep 15
          
          # بررسی وجود کلید
          if [ -z "$TS_KEY" ]; then
            echo "❌ ERROR: TAILSCALE_AUTH_KEY is empty. Please check GitHub Secrets."
            exit 1
          fi

          # تلاش برای اتصال (اگر کلید Ephemeral باشد بهتر است)
          sudo tailscale up --authkey=$TS_KEY --hostname=gh-macos-runner --accept-routes
          
          TS_IP=$(tailscale ip -4)
          echo "TS_IP=$TS_IP" >> $GITHUB_ENV

      - name: Final Info & Keep Alive
        run: |
          echo "=========================================="
          echo "📍 IP: ${{ env.TS_IP }}"
          echo "👤 User: ${{ env.USER_NAME }}"
          echo "🔑 Pass: ${{ env.USER_PASS }}"
          echo "🔒 VNC: SecretVNC123"
          echo "=========================================="
          
          while true; do
            echo "Keep-alive... $(date)"
            sleep 300
          done
          
