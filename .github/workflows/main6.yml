name: macOS-Remote-Desktop

on:
  workflow_dispatch:

jobs:
  macos-vnc:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Enable Remote Management (VNC)
        run: |
          # فعال‌سازی سرویس Remote Management
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvncpw -vncpw "SecretVNC123" \
            -restart -agent -privs -all
          
          # اجازه دسترسی به همه کاربران
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -allowAccessFor -allUsers -privs -all

      - name: Configure User Credentials
        run: |
          # پیدا کردن نام یوزر فعلی
          CURRENT_USER=$(whoami)
          NEW_PASS="MacAccess@2024"
          
          echo "Target User: $CURRENT_USER"
          
          # استفاده از sysadminctl به جای dscl برای پایداری بیشتر در مک‌های جدید
          sudo sysadminctl -adminUser $CURRENT_USER -adminPassword "" -resetPasswordFor $CURRENT_USER -newPassword "$NEW_PASS" || \
          (echo "Primary method failed, trying fallback..." && sudo dscl . -passwd /Users/$CURRENT_USER "$NEW_PASS")
          
          echo "USER_NAME=$CURRENT_USER" >> $GITHUB_ENV
          echo "USER_PASS=$NEW_PASS" >> $GITHUB_ENV

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start Tailscale
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo tailscaled > /dev/null 2>&1 &
          sleep 10
          sudo tailscale up --authkey=$TS_KEY --hostname=gh-macos-runner
          
          TS_IP=$(tailscale ip -4)
          echo "TS_IP=$TS_IP" >> $GITHUB_ENV

      - name: Connection Info & Keep Alive
        run: |
          echo "=========================================="
          echo "📍 Tailscale IP: ${{ env.TS_IP }}"
          echo "👤 Username: ${{ env.USER_NAME }}"
          echo "🔑 Password: ${{ env.USER_PASS }}"
          echo "🔒 VNC Password: SecretVNC123"
          echo "=========================================="
          
          while true; do
            echo "Keep-alive: $(date)"
            sleep 300
          done
          
