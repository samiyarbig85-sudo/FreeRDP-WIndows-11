name: macOS-Remote-Desktop-Final-Fix

on:
  workflow_dispatch:

jobs:
  macos-vnc:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Force Enable VNC & Fix Authentication
        run: |
          # متوقف کردن سرویس برای اعمال تنظیمات جدید
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -deactivate
          
          # تنظیم پسورد VNC به روش مستقیم (فایل سیستم)
          # رمز عبور در اینجا: 123456 (برای سادگی در تایپ موبایل)
          sudo /usr/libexec/PlistBuddy -c "Delete :VNCPassword" /Library/Preferences/com.apple.VNCSettings.txt || true
          echo "123456" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; $_=<>; chomp; s/\s+$//; @p = unpack "C*", $_; @e = map { shift(@k) ^ $_ } @p; print pack "C*", @e' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt > /dev/null
          
          # استارت مجدد با دسترسی کامل
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -restart -agent -privs -all

      - name: Create User & Wake GUI
        run: |
          # ساخت یوزر rdpuser (اگر از قبل ساخته شده باشد ارور نمی‌دهد)
          sudo dscl . -create /Users/rdpuser || true
          sudo dscl . -create /Users/rdpuser UserShell /bin/bash || true
          sudo dscl . -passwd /Users/rdpuser "MacAccess@2026" || true
          sudo dscl . -append /Groups/admin GroupMembership rdpuser || true
          
          # باز کردن یک اپلیکیشن برای بیدار کردن محیط گرافیکی
          open -a Finder
          open -a Calculator

      - name: Install & Start Tailscale
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          brew install tailscale
          sudo tailscaled > /dev/null 2>&1 &
          sleep 10
          sudo tailscale up --authkey=$TS_KEY --hostname=gh-mac
          echo "TS_IP=$(tailscale ip -4)" >> $GITHUB_ENV

      - name: Display Connection Info
        run: |
          echo "=========================================="
          echo "📍 IP: ${{ env.TS_IP }}"
          echo "👤 OS User: rdpuser"
          echo "🔑 OS Pass: MacAccess@2026"
          echo "🔒 VNC Pass: 123456"
          echo "=========================================="
          
          # Keep Alive
          while true; do sleep 300; done
          
