name: macOS-Remote-Desktop

on:
  workflow_dispatch:

jobs:
  macos-vnc:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Enable Remote Management (VNC)
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvncpw -vncpw "SecretVNC123" \
            -restart -agent -privs -all

      - name: Configure User Credentials
        run: |
          CURRENT_USER=$(whoami)
          NEW_PASS="MacAccess@2024"
          sudo dscl . -passwd /Users/$CURRENT_USER "$NEW_PASS" || echo "Warning: Password change failed"
          echo "USER_NAME=$CURRENT_USER" >> $GITHUB_ENV
          echo "USER_PASS=$NEW_PASS" >> $GITHUB_ENV

      - name: Install Tailscale via Homebrew
        run: |
          # نصب از طریق brew برای شناسایی خودکار مسیرها
          brew install tailscale
          # اضافه کردن مسیر brew به PATH (برای اطمینان)
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Start Tailscale
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          # اجرای سرویس پس‌زمینه در مک
          sudo tailscaled > /dev/null 2>&1 &
          sleep 15
          
          # حالا دستور tailscale به راحتی شناخته می‌شود
          sudo tailscale up --authkey=$TS_KEY --hostname=gh-macos-runner
          
          TS_IP=$(tailscale ip -4)
          echo "TS_IP=$TS_IP" >> $GITHUB_ENV

      - name: Connection Info & Keep Alive
        run: |
          echo "=========================================="
          echo "✅ macOS Remote Desktop is Ready!"
          echo "------------------------------------------"
          echo "📍 Tailscale IP: ${{ env.TS_IP }}"
          echo "👤 Username: ${{ env.USER_NAME }}"
          echo "🔑 Password: ${{ env.USER_PASS }}"
          echo "🔒 VNC Password: SecretVNC123"
          echo "=========================================="
          
          while true; do
            echo "Keep-alive: $(date) - IP: ${{ env.TS_IP }}"
            sleep 300
          done
          
