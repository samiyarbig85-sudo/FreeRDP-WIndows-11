name: macOS-Cloudflare-VNC

on:
  workflow_dispatch:

jobs:
  macos-vnc:
    runs-on: macos-latest
    steps:
      - name: Install Cloudflared and VNC
        run: |
          brew install cloudflared tiger-vnc

      - name: Setup VNC Server
        run: |
          # تنظیم پسورد VNC
          mkdir -p ~/.vnc
          echo "123456" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          # اجرای سرور VNC روی پورت 5901
          vncserver :1 -geometry 1280x720 -depth 24 -localhost no

      - name: Start Cloudflare Tunnel
        run: |
          # ایجاد یک تونل موقت (Quick Tunnel)
          # خروجی این دستور شامل یک لینک .trycloudflare.com خواهد بود
          cloudflared tunnel --url tcp://localhost:5901 > cloudflare.log 2>&1 &
          
      - name: Get Connection Link
        run: |
          sleep 10
          echo "=========================================="
          echo "🔗 Cloudflare Tunnel Address:"
          grep -o 'https://[-0-9a-z]*\.trycloudflare.com' cloudflare.log | sed 's/https/tcp/'
          echo "------------------------------------------"
          echo "🔑 VNC Password: 123456"
          echo "=========================================="

      - name: Keep Alive
        run: |
          while true; do
            echo "Runner status: Active $(date)"
            sleep 300
          done
          
