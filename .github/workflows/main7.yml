name: macOS-14-Web-GUI

on:
  workflow_dispatch:

jobs:
  macos-gui:
    # استفاده از نسخه 14 مطابق درخواست شما
    runs-on: macos-14
    timeout-minutes: 3600

    steps:
      - name: Install Dependencies
        run: |
          # نصب ابزارها
          brew install cloudflared tiger-vnc
          # دانلود noVNC
          git clone https://github.com/novnc/noVNC.git /tmp/novnc

      - name: Setup VNC Server
        run: |
          # اضافه کردن مسیر Brew به PATH برای شناسایی دستور vncpasswd
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          
          # ایجاد دایرکتوری تنظیمات
          mkdir -p ~/.vnc
          
          # تنظیم پسورد VNC (123456)
          echo "123456" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          # اجرای سرور VNC روی پورت 5901
          vncserver :1 -geometry 1280x720 -depth 24 -localhost no

      - name: Launch noVNC Proxy
        run: |
          # تبدیل VNC به وب (پورت 6080)
          /tmp/novnc/utils/novnc_proxy --vnc localhost:5901 --listen 6080 &

      - name: Start Cloudflare Tunnel
        run: |
          # ایجاد تونل کلودفلر
          cloudflared tunnel --url http://localhost:6080 > cloudflare.log 2>&1 &

      - name: Get Web Link
        run: |
          sleep 20
          echo "=========================================="
          echo "🌐 آدرس زیر را در مرورگر کروم گوشی باز کنید:"
          # پیدا کردن لینک کلودفلر از فایل لوگ
          grep -o 'https://[-0-9a-z]*\.trycloudflare.com' cloudflare.log
          echo "------------------------------------------"
          echo "🔑 Password: 123456"
          echo "=========================================="

      - name: Keep Alive
        run: |
          while true; do
            echo "GUI is Active on macOS 14... $(date)"
            sleep 300
          done
          
