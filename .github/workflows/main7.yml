name: macOS-14-Final-GUI-Chrome

on:
  workflow_dispatch:

jobs:
  macos-gui:
    runs-on: macos-14
    timeout-minutes: 3600

    steps:
      - name: Install Cloudflared and TigerVNC
        run: |
          # نصب مستقیم و اجباری
          brew install cloudflared tiger-vnc
          # کلون کردن رابط وب
          git clone https://github.com/novnc/noVNC.git /tmp/novnc

      - name: Start VNC and Web Proxy
        run: |
          # اضافه کردن تمام مسیرهای ممکن به سیستم
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:$PATH"
          
          # تنظیم پسورد
          mkdir -p ~/.vnc
          echo "123456" | /opt/homebrew/bin/vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          # اجرای سرور گرافیکی (GUI اصلی)
          /opt/homebrew/bin/vncserver :1 -geometry 1280x720 -depth 24 -localhost no
          
          # اجرای پل ارتباطی وب (noVNC)
          /tmp/novnc/utils/novnc_proxy --vnc localhost:5901 --listen 6080 &
          
          # اجرای تونل کلودفلر
          /opt/homebrew/bin/cloudflared tunnel --url http://localhost:6080 > cloudflare.log 2>&1 &

      - name: Get Web Access Link
        run: |
          sleep 30
          echo "=========================================="
          echo "🌐 آدرس زیر را در مرورگر کروم گوشی باز کنید:"
          # استخراج لینک از فایل لاگ
          grep -o 'https://[-0-9a-z]*\.trycloudflare.com' cloudflare.log || echo "هنوز لینک آماده نیست، چند لحظه دیگر دوباره چک کنید"
          echo "------------------------------------------"
          echo "🔑 Password: 123456"
          echo "=========================================="

      - name: Keep Alive
        run: |
          while true; do
            echo "GUI is streaming at $(date)"
            sleep 300
          done
          
