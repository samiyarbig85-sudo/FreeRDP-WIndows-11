name: macOS-14-Final-Auth-Fix

on:
  workflow_dispatch:

jobs:
  macos-gui:
    runs-on: macos-14
    timeout-minutes: 3600

    steps:
      - name: Install Cloudflared & noVNC
        run: |
          brew install cloudflared
          git clone https://github.com/novnc/noVNC.git /tmp/novnc

      - name: Force Enable Apple VNC with Password
        run: |
          # ۱. متوقف کردن سرویس برای اعمال تغییرات
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -deactivate -stop

          # ۲. تنظیم مستقیم پسورد VNC به ۱۲۳۴۵۶ (روش رسمی برای Sonoma)
          # این دستور مستقیم رمز را در لایه امنیتی اپل ست می‌کند
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes \
            -configure -clientopts -setvncpw -vncpw 123456

          # ۳. فعال‌سازی دسترسی برای همه یوزرهای سیستم (از جمله runner)
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -restart -agent -privs -all

          # ۴. بیدار نگه داشتن دسکتاپ برای جلوگیری از قطع شدن تصویر
          sudo caffeinate -u -t 3600 &

      - name: Start noVNC and Cloudflare
        run: |
          # متصل کردن پورت داخلی مک (5900) به پورت وب (6080)
          /tmp/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &
          
          # ایجاد تونل کلودفلر
          cloudflared tunnel --url http://localhost:6080 > cloudflare.log 2>&1 &

      - name: Get Connection Link
        run: |
          sleep 20
          echo "=========================================="
          echo "🌐 لینک ورود در مرورگر کروم:"
          grep -o 'https://[-0-9a-z]*\.trycloudflare.com' cloudflare.log
          echo "------------------------------------------"
          echo "🔑 Password for VNC: 123456"
          echo "=========================================="

      - name: Keep Alive
        run: |
          while true; do
            echo "GUI is Active... $(date)"
            sleep 300
          done
          
