name: macOS-14-Auth-Fixed-GUI

on:
  workflow_dispatch:

jobs:
  macos-gui:
    runs-on: macos-14
    timeout-minutes: 3600

    steps:
      - name: Install Cloudflared & noVNC
        run: |
          brew install cloudflared
          git clone https://github.com/novnc/noVNC.git /tmp/novnc

      - name: Fix Apple VNC Authentication
        run: |
          echo "Configuring VNC for the active runner user..."
          
          # ۱. پاک کردن تنظیمات و پسوردهای گیر کرده قبلی
          sudo rm -f /Library/Preferences/com.apple.VNCSettings.txt
          
          # ۲. ساخت پسورد 123456 با هش مخصوص اپل
          echo -n "123456" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; $_=<>; chomp; s/\s+$//; @p = unpack "C*", $_; @e = map { shift(@k) ^ $_ } @p; print pack "C*", @e' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt > /dev/null
          # دادن دسترسی خواندن به سیستم برای جلوگیری از ارور
          sudo chmod 444 /Library/Preferences/com.apple.VNCSettings.txt
          
          # ۳. ریستارت کامل سرویس اسکرین‌شرینگ اپل با دسترسی آزاد برای VNC
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -deactivate -stop
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -allowAccessFor -allUsers -access -on -clientopts -setvnclegacy -vnclegacy yes -privs -all -restart -agent
          
          # ۴. بیدار نگه داشتن دسکتاپ
          sudo caffeinate -u -t 3600 &

      - name: Start Web Proxy & Cloudflare
        run: |
          # وصل کردن noVNC مستقیم به دسکتاپ مک
          /tmp/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &
          
          # ساخت تونل روی وب
          cloudflared tunnel --url http://localhost:6080 > cloudflare.log 2>&1 &

      - name: Get Web Access Link
        run: |
          sleep 15
          echo "=========================================="
          echo "🌐 آدرس زیر را در کروم گوشی باز کنید:"
          grep -o 'https://[-0-9a-z]*\.trycloudflare.com' cloudflare.log || echo "لینک هنوز آماده نیست، دوباره لاگ را چک کنید"
          echo "------------------------------------------"
          echo "🔑 Password: 123456"
          echo "=========================================="

      - name: Keep Alive
        run: |
          while true; do sleep 300; done
          
