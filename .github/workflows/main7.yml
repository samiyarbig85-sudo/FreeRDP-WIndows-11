name: macOS-14-Web-GUI-Fixed

on:
  workflow_dispatch:

jobs:
  macos-gui:
    runs-on: macos-14
    timeout-minutes: 3600

    steps:
      - name: Install and Setup VNC Server
        run: |
          # ۱. نصب ابزارها
          brew install cloudflared tiger-vnc
          
          # ۲. تعریف مسیر Homebrew برای شناسایی vncpasswd و vncserver
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          
          # ۳. تنظیم پسورد VNC
          mkdir -p ~/.vnc
          echo "123456" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          # ۴. اجرای سرور VNC
          vncserver :1 -geometry 1280x720 -depth 24 -localhost no
          
          # ۵. دانلود و آماده‌سازی noVNC
          git clone https://github.com/novnc/noVNC.git /tmp/novnc

      - name: Launch noVNC and Cloudflare
        run: |
          # تعریف مجدد مسیر برای احتیاط
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          
          # تبدیل VNC به وب (پورت 6080)
          /tmp/novnc/utils/novnc_proxy --vnc localhost:5901 --listen 6080 &
          
          # ایجاد تونل کلودفلر
          cloudflared tunnel --url http://localhost:6080 > cloudflare.log 2>&1 &

      - name: Get Access Link
        run: |
          sleep 20
          echo "=========================================="
          echo "🌐 آدرس زیر را در مرورگر کروم گوشی باز کنید:"
          grep -o 'https://[-0-9a-z]*\.trycloudflare.com' cloudflare.log
          echo "------------------------------------------"
          echo "🔑 Password: 123456"
          echo "=========================================="

      - name: Keep Alive
        run: |
          while true; do
            echo "GUI is Active on macOS 14... $(date)"
            sleep 300
          done
          
