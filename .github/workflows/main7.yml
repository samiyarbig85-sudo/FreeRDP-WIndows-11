name: macOS-14-Web-GUI-Final-Fix

on:
  workflow_dispatch:

jobs:
  macos-gui:
    runs-on: macos-14
    timeout-minutes: 3600

    steps:
      - name: Install Tools
        run: |
          brew install cloudflared tiger-vnc
          git clone https://github.com/novnc/noVNC.git /tmp/novnc

      - name: Start VNC Server
        run: |
          # پیدا کردن مسیر با روش استاندارد مک
          VNC_BIN_PATH=$(dirname $(find /opt/homebrew/Cellar/tiger-vnc -name vncpasswd | head -n 1))
          echo "Binaries found in: $VNC_BIN_PATH"
          
          # اجرای مستقیم با آدرس کامل برای جلوگیری از هرگونه خطا
          mkdir -p ~/.vnc
          $VNC_BIN_PATH/vncpasswd -f <<EOF
          123456
          123456
          EOF
          chmod 600 ~/.vnc/passwd
          
          # اجرای سرور
          $VNC_BIN_PATH/vncserver :1 -geometry 1280x720 -depth 24 -localhost no

      - name: Launch Web Proxy & Cloudflare
        run: |
          # پیدا کردن مسیر کلودفلر
          CF_BIN=$(find /opt/homebrew/bin /opt/homebrew/sbin -name cloudflared | head -n 1)
          
          # اجرای noVNC
          /tmp/novnc/utils/novnc_proxy --vnc localhost:5901 --listen 6080 &
          
          # اجرای کلودفلر
          $CF_BIN tunnel --url http://localhost:6080 > cloudflare.log 2>&1 &

      - name: Get Access Link
        run: |
          sleep 30
          echo "=========================================="
          echo "🌐 آدرس ورود در مرورگر کروم گوشی:"
          grep -o 'https://[-0-9a-z]*\.trycloudflare.com' cloudflare.log || echo "لینک هنوز آماده نیست، ۳۰ ثانیه دیگر صفحه را رفرش کنید"
          echo "------------------------------------------"
          echo "🔑 Password: 123456"
          echo "=========================================="

      - name: Keep Alive
        run: |
          while true; do sleep 300; done
          
