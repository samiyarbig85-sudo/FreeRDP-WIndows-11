name: macOS-14-Final-Success-GUI

on:
  workflow_dispatch:

jobs:
  macos-gui:
    runs-on: macos-14
    timeout-minutes: 3600

    steps:
      - name: Install Cloudflared & noVNC
        run: |
          brew install cloudflared
          git clone https://github.com/novnc/noVNC.git /tmp/novnc

      - name: Force Fix VNC Authentication
        run: |
          # ۱. متوقف کردن کامل سرویس‌های مدیریت از راه دور
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -deactivate -stop

          # ۲. تنظیم اجباری رمز عبور VNC به 123456 در دیتابیس اپل
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setvnclegacy -vnclegacy yes
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setvncpw -vncpw 123456

          # ۳. باز کردن تمام لایه‌های امنیتی برای دسترسی بدون محدودیت
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCDevicePassword -string "123456"
          
          # ۴. فعال‌سازی مجدد سرویس با بالاترین سطح دسترسی (Privileges All)
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -restart -agent -privs -all

          # ۵. بیدار نگه داشتن سیستم
          sudo caffeinate -u -t 3600 &

      - name: Start noVNC and Cloudflare
        run: |
          # اجرای پروکسی وب
          /tmp/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &
          
          # ایجاد تونل کلودفلر
          cloudflared tunnel --url http://localhost:6080 > cloudflare.log 2>&1 &

      - name: Get Connection Link
        run: |
          sleep 20
          echo "=========================================="
          echo "🌐 آدرس ورود در مرورگر کروم:"
          grep -o 'https://[-0-9a-z]*\.trycloudflare.com' cloudflare.log
          echo "------------------------------------------"
          echo "🔑 Password: 123456"
          echo "=========================================="

      - name: Keep Alive
        run: |
          while true; do
            echo "Mac GUI is running... $(date)"
            sleep 300
          done
          
