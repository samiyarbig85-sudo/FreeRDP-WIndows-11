name: macOS-14-Web-GUI-Ultra-Fix

on:
  workflow_dispatch:

jobs:
  macos-gui:
    runs-on: macos-14
    timeout-minutes: 3600

    steps:
      - name: Install Tools
        run: |
          brew install cloudflared tiger-vnc
          git clone https://github.com/novnc/noVNC.git /tmp/novnc

      - name: Locate and Start VNC Server
        run: |
          # ۱. پیدا کردن آدرس دقیق فایل‌های اجرایی TigerVNC در سیستم
          VNC_PATH=$(find /opt/homebrew/Cellar/tiger-vnc -name vncpasswd -parent | head -n 1)
          echo "Found VNC binaries at: $VNC_PATH"
          
          # ۲. اضافه کردن آدرس پیدا شده به مسیرهای سیستم
          export PATH="$VNC_PATH:$PATH"
          
          # ۳. تنظیم پسورد
          mkdir -p ~/.vnc
          vncpasswd -f <<EOF
          123456
          123456
          EOF
          chmod 600 ~/.vnc/passwd
          
          # ۴. اجرای سرور
          vncserver :1 -geometry 1280x720 -depth 24 -localhost no

      - name: Launch Web Proxy & Cloudflare
        run: |
          # پیدا کردن آدرس کلودفلر (با توجه به اروری که دادی)
          CF_PATH=$(find /opt/homebrew -name cloudflared | head -n 1)
          
          # اجرای noVNC
          /tmp/novnc/utils/novnc_proxy --vnc localhost:5901 --listen 6080 &
          
          # اجرای کلودفلر
          $CF_PATH tunnel --url http://localhost:6080 > cloudflare.log 2>&1 &

      - name: Get Access Link
        run: |
          sleep 30
          echo "=========================================="
          echo "🌐 آدرس ورود در مرورگر کروم گوشی:"
          grep -o 'https://[-0-9a-z]*\.trycloudflare.com' cloudflare.log || echo "هنوز لینک تولید نشده، ۳۰ ثانیه دیگر لاگ را چک کنید"
          echo "------------------------------------------"
          echo "🔑 Password: 123456"
          echo "=========================================="

      - name: Keep Alive
        run: |
          while true; do
            echo "GUI is Active... $(date)"
            sleep 300
          done
          
