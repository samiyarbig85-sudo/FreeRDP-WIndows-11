name: macOS-14-Web-GUI-DirectPath

on:
  workflow_dispatch:

jobs:
  macos-gui:
    runs-on: macos-14
    timeout-minutes: 3600

    steps:
      - name: Install and Setup VNC Server
        run: |
          # ۱. نصب ابزارها
          brew install cloudflared tiger-vnc
          
          # ۲. ایجاد دایرکتوری تنظیمات
          mkdir -p ~/.vnc
          
          # ۳. استفاده از مسیر مستقیم برای vncpasswd (رفع ارور 127)
          # در مک‌های سری M مسیر معمولاً /opt/homebrew/bin/ است
          /opt/homebrew/bin/vncpasswd -f <<EOF
          123456
          123456
          EOF
          
          chmod 600 ~/.vnc/passwd
          
          # ۴. اجرای سرور VNC با آدرس کامل
          /opt/homebrew/bin/vncserver :1 -geometry 1280x720 -depth 24 -localhost no
          
          # ۵. دانلود noVNC
          git clone https://github.com/novnc/noVNC.git /tmp/novnc

      - name: Launch noVNC and Cloudflare
        run: |
          # تبدیل VNC به وب
          /tmp/novnc/utils/novnc_proxy --vnc localhost:5901 --listen 6080 &
          
          # اجرای کلودفلر با آدرس کامل (طبق اروری که دادی در این مسیر است)
          /opt/homebrew/bin/cloudflared tunnel --url http://localhost:6080 > cloudflare.log 2>&1 &

      - name: Get Access Link
        run: |
          # صبر برای تولید لینک
          sleep 30
          echo "=========================================="
          echo "🌐 لینک ورود (در مرورگر باز کنید):"
          grep -o 'https://[-0-9a-z]*\.trycloudflare.com' cloudflare.log || echo "لینک هنوز تولید نشده، دوباره لاگ را چک کنید"
          echo "------------------------------------------"
          echo "🔑 VNC Password: 123456"
          echo "=========================================="

      - name: Keep Alive
        run: |
          while true; do
            echo "GUI is Active... $(date)"
            sleep 300
          done
          
